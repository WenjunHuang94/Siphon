name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check portable CLI and manifests without GPU dependencies
        run: |
          python -m unittest discover -s tests -v
          python -m siphon.inference --help
          python -m siphon.inference --base-only --examples examples/examples.json --output-dir outputs --dry-run
