[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siphon-visual-editing"
version = "0.1.0"
description = "LongCat-based Siphon visual-instruction inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Siphon authors"}]
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@e39aecff57ed14d1018529c3de6ec3c34fadb559",
    "transformers==4.51.3",
    "peft==0.17.1",
    "accelerate>=1.11,<2",
    "safetensors>=0.8,<1",
    "Pillow>=10,<13",
    "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/WenjunHuang94/Siphon"
Homepage = "https://wenjunhuang94.github.io/Siphon/"
Paper = "https://openreview.net/forum?id=mKfQzVpQIM"

[project.scripts]
siphon-infer = "siphon.inference:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["siphon*"]
